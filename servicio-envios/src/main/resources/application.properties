spring.application.name=servicio-envios

# Puerto del microservicio. Local usa 8086; el contenedor lo sobrescribe con SERVER_PORT.
server.port=${SERVER_PORT:8086}

# Origenes permitidos por CORS (separados por coma).
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Seguridad JWT - Azure AD / Microsoft Entra ID (defensa en
# profundidad además del JWT Authorizer del AWS API Gateway).
# ============================================================
app.seguridad.habilitado=${JWT_ENABLED:false}
app.seguridad.jwks-uri=${JWT_JWKS_URI:}
app.seguridad.emisor-uri=${JWT_ISSUER_URI:}
app.seguridad.audiencias=${JWT_AUDIENCES:}
app.seguridad.scopes-requeridos=${JWT_REQUIRED_SCOPES:orders.write}
app.seguridad.roles-requeridos=${JWT_REQUIRED_ROLES:}
app.seguridad.local-habilitado=${JWT_LOCAL_ENABLED:false}
app.seguridad.local-secreto=${JWT_LOCAL_SECRET:}
app.seguridad.local-emisor=${JWT_LOCAL_ISSUER:pedidos360-usuarios}
app.seguridad.local-audiencia=${JWT_LOCAL_AUDIENCE:pedidos360-api}
app.seguridad.local-scope-requerido=${JWT_LOCAL_REQUIRED_SCOPE:orders.write}

# ============================================================
# RabbitMQ: consume pedido.creado (misma topología que pedidos).
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASS:cambiar-en-produccion}
app.mq.exchange=pedidos.eventos
app.mq.routing-pedido-creado=pedido.creado

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
